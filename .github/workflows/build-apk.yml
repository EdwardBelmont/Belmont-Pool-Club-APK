name: Build Belmont Pool Club APK

on:
push:
branches:
- main
- master
workflow_dispatch:

jobs:
build-android-apk:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Prepare Capacitor Android project
    run: |
      mkdir -p www
      if [ -f "index.html" ]; then
        cp index.html www/index.html
      else
        FIRST_HTML=$(find . -maxdepth 2 -name "*.html" | head -n 1)
        if [ -n "$FIRST_HTML" ]; then
          cp "$FIRST_HTML" www/index.html
        else
          echo "ERROR: No se encontro index.html en la raiz del repositorio."
          exit 1
        fi
      fi

      cat << 'JSONEOF' > package.json
      {
        "name": "belmont-pool-club",
        "version": "1.0.0",
        "description": "Belmont Pool Club",
        "main": "index.js",
        "private": true
      }
      JSONEOF

      cat << 'CAPEOF' > capacitor.config.json
      {
        "appId": "com.edwardbelmont.poolclub",
        "appName": "Belmont Pool Club",
        "webDir": "www"
      }
      CAPEOF

      npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
      npx cap add android
      npx cap copy android

  - name: Generate 8-Ball icon and configure AndroidManifest
    run: |
      python3 -m pip install pillow --break-system-packages || pip install pillow
      cat << 'PYEOF' > setup_android.py
      import os
      from PIL import Image, ImageDraw, ImageFilter

      def create_8ball_icon(size=1024, is_foreground=False):
          bg_color = (0, 0, 0, 0) if is_foreground else (11, 7, 20, 255)
          img = Image.new("RGBA", (size, size), bg_color)

          scale = 0.66 if is_foreground else 1.0
          offset = int(size * (1.0 - scale) / 2)
          s = int(size * scale)

          ball_layer = Image.new("RGBA", (s, s), (0, 0, 0, 0))
          glow = Image.new("RGBA", (s, s), (0, 0, 0, 0))
          gdraw = ImageDraw.Draw(glow)
          gdraw.ellipse((s * 0.08, s * 0.08, s * 0.92, s * 0.92), fill=(147, 51, 234, 150))
          gdraw.ellipse((s * 0.14, s * 0.14, s * 0.86, s * 0.86), fill=(192, 132, 252, 180))
          glow = glow.filter(ImageFilter.GaussianBlur(radius=s * 0.05))
          ball_layer = Image.alpha_composite(ball_layer, glow)

          bdraw = ImageDraw.Draw(ball_layer)
          margin = int(s * 0.14)
          bdraw.ellipse((margin - 6, margin - 6, s - margin + 6, s - margin + 6), fill=(168, 85, 247, 255))
          bdraw.ellipse((margin, margin, s - margin, s - margin), fill=(12, 10, 18, 255))

          shine = Image.new("RGBA", (s, s), (0, 0, 0, 0))
          sdraw = ImageDraw.Draw(shine)
          sdraw.ellipse((int(s * 0.24), int(s * 0.20), int(s * 0.52), int(s * 0.40)), fill=(255, 255, 255, 55))
          shine = shine.filter(ImageFilter.GaussianBlur(radius=s * 0.02))
          ball_layer = Image.alpha_composite(ball_layer, shine)

          bdraw = ImageDraw.Draw(ball_layer)
          c_margin = int(s * 0.33)
          bdraw.ellipse((c_margin - 5, c_margin - 5, s - c_margin + 5, s - c_margin + 5), fill=(147, 51, 234, 255))
          bdraw.ellipse((c_margin, c_margin, s - c_margin, s - c_margin), fill=(248, 250, 252, 255))

          cx, cy = s // 2, s // 2
          r_top = int(s * 0.065)
          r_bot = int(s * 0.078)
          stroke = max(2, int(s * 0.032))

          bdraw.ellipse((cx - r_top, cy - r_top * 2 + 4, cx + r_top, cy + 4), fill=(18, 12, 34, 255))
          bdraw.ellipse((cx - r_top + stroke, cy - r_top * 2 + 4 + stroke, cx + r_top - stroke, cy + 4 - stroke), fill=(248, 250, 252, 255))

          bdraw.ellipse((cx - r_bot, cy - 4, cx + r_bot, cy + r_bot * 2 - 4), fill=(18, 12, 34, 255))
          bdraw.ellipse((cx - r_bot + stroke, cy - 4 + stroke, cx + r_bot - stroke, cy + r_bot * 2 - 4 - stroke), fill=(248, 250, 252, 255))

          img.paste(ball_layer, (offset, offset), ball_layer)
          return img

      icon_full = create_8ball_icon(1024, is_foreground=False)
      icon_fg = create_8ball_icon(1024, is_foreground=True)

      res_dir = "android/app/src/main/res"
      for root, dirs, files in os.walk(res_dir):
          for filename in files:
              full_path = os.path.join(root, filename)
              if filename in ("ic_launcher.png", "ic_launcher_round.png"):
                  with Image.open(full_path) as orig:
                      w, h = orig.size
                  icon_full.resize((w, h), Image.Resampling.LANCZOS).save(full_path, "PNG")
              elif filename == "ic_launcher_foreground.png":
                  with Image.open(full_path) as orig:
                      w, h = orig.size
                  icon_fg.resize((w, h), Image.Resampling.LANCZOS).save(full_path, "PNG")
              elif filename == "splash.png":
                  with Image.open(full_path) as orig:
                      w, h = orig.size
                  splash = Image.new("RGBA", (w, h), (11, 7, 20, 255))
                  side = int(min(w, h) * 0.35)
                  logo = icon_full.resize((side, side), Image.Resampling.LANCZOS)
                  splash.paste(logo, ((w - side) // 2, (h - side) // 2), logo)
                  splash.save(full_path, "PNG")

      bg_xml = os.path.join(res_dir, "values", "ic_launcher_background.xml")
      if os.path.exists(bg_xml):
          with open(bg_xml, "w", encoding="utf-8") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#0B0714</color></resources>')

      manifest_path = "android/app/src/main/AndroidManifest.xml"
      with open(manifest_path, "r", encoding="utf-8") as f:
          content = f.read()

      if "android:usesCleartextTraffic=" not in content:
          content = content.replace(
              "<application",
              '<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"',
              1
          )

      if "android:screenOrientation=" not in content:
          content = content.replace(
              "<activity",
              '<activity android:screenOrientation="sensorLandscape"',
              1
          )

      if "android.permission.VIBRATE" not in content:
          content = content.replace(
              "</manifest>",
              '    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>'
          )

      with open(manifest_path, "w", encoding="utf-8") as f:
          f.write(content)

      print("Iconos y AndroidManifest configurados correctamente.")
      PYEOF
      python3 setup_android.py

  - name: Enable native Android immersive fullscreen
    run: |
      cat << 'JAVAEOF' > android/app/src/main/java/com/edwardbelmont/poolclub/MainActivity.java
      package com.edwardbelmont.poolclub;

      import android.os.Build;
      import android.os.Bundle;
      import android.view.WindowManager;
      import androidx.core.view.WindowCompat;
      import androidx.core.view.WindowInsetsCompat;
      import androidx.core.view.WindowInsetsControllerCompat;
      import com.getcapacitor.BridgeActivity;

      public class MainActivity extends BridgeActivity {
          @Override
          protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                  lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                  getWindow().setAttributes(lp);
              }
              hideSystemUI();
          }

          @Override
          public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) {
                  hideSystemUI();
              }
          }

          private void hideSystemUI() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
              WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              if (controller != null) {
                  controller.hide(WindowInsetsCompat.Type.systemBars());
                  controller.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
      }
      JAVAEOF

  - name: Build Android APK
    working-directory: ./android
    run: |
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Copy and rename APK
    run: |
      cp android/app/build/outputs/apk/debug/app-debug.apk BelmontPoolClub.apk

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: Belmont-Pool-Club-APK
      path: BelmontPoolClub.apk
      if-no-files-found: error
