name: Build Belmont Pool Club APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Preparar proyecto Capacitor y empaquetar index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

          npx cap init "Belmont Pool Club" "com.edwardbelmont.poolclub" --web-dir www
          npx cap add android
          npx cap copy android

      - name: 5. Optimizar AndroidManifest (Pantalla completa, Red y Rendimiento)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Habilitar tráfico de red para salas online y mantener pantalla encendida
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"

          # Asegurar permisos de red y vibración si no existen
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.VIBRATE" \/>
<\/manifest>/g' "$MANIFEST"
          fi

      - name: 6. Compilar APK instalable (Debug firmado automáticamente)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Renombrar APK listo para instalar
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BelmontPoolClub.apk

      - name: 8. Subir APK como Descargable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Belmont-Pool-Club-APK
          path: BelmontPoolClub.apk
          if-no-files-found: error
