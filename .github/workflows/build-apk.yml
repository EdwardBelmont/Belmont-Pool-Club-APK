name: Build Belmont Pool Club APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Generar Icono Bola 8 y Splash (Estética Obsidiana/Púrpura)
        run: |
          pip install pillow
          mkdir -p assets
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          def create_8ball_icon(size=1024):
              # Fondo obsidiana púrpura oscuro
              img = Image.new("RGBA", (size, size), (11, 7, 20, 255))
              draw = ImageDraw.Draw(img)

              # Resplandor neon púrpura detrás de la bola
              glow = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              gdraw = ImageDraw.Draw(glow)
              gdraw.ellipse((size*0.08, size*0.08, size*0.92, size*0.92), fill=(147, 51, 234, 150))
              gdraw.ellipse((size*0.14, size*0.14, size*0.86, size*0.86), fill=(192, 132, 252, 180))
              glow = glow.filter(ImageFilter.GaussianBlur(radius=size*0.06))
              img = Image.alpha_composite(img, glow)
              draw = ImageDraw.Draw(img)

              # Anillo exterior metálico púrpura
              margin = int(size * 0.14)
              draw.ellipse((margin-8, margin-8, size-margin+8, size-margin+8), fill=(168, 85, 247, 255))

              # Cuerpo de la Bola 8 (negro obsidiana profundo)
              draw.ellipse((margin, margin, size-margin, size-margin), fill=(12, 10, 18, 255))

              # Brillo superior izquierdo (efecto cristal/billar)
              shine = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              sdraw = ImageDraw.Draw(shine)
              sdraw.ellipse((int(size*0.24), int(size*0.20), int(size*0.52), int(size*0.40)), fill=(255, 255, 255, 55))
              shine = shine.filter(ImageFilter.GaussianBlur(radius=size*0.02))
              img = Image.alpha_composite(img, shine)
              draw = ImageDraw.Draw(img)

              # Círculo central blanco con borde violeta
              c_margin = int(size * 0.33)
              draw.ellipse((c_margin-6, c_margin-6, size-c_margin+6, size-c_margin+6), fill=(147, 51, 234, 255))
              draw.ellipse((c_margin, c_margin, size-c_margin, size-c_margin), fill=(248, 250, 252, 255))

              # Dibujar el número "8" geométrico perfecto en el centro
              cx, cy = size // 2, size // 2
              r_top = int(size * 0.065)
              r_bot = int(size * 0.078)
              stroke = int(size * 0.032)

              # Anillo superior del 8
              draw.ellipse((cx - r_top, cy - r_top*2 + 6, cx + r_top, cy + 6), fill=(18, 12, 34, 255))
              draw.ellipse((cx - r_top + stroke, cy - r_top*2 + 6 + stroke, cx + r_top - stroke, cy + 6 - stroke), fill=(248, 250, 252, 255))

              # Anillo inferior del 8
              draw.ellipse((cx - r_bot, cy - 6, cx + r_bot, cy + r_bot*2 - 6), fill=(18, 12, 34, 255))
              draw.ellipse((cx - r_bot + stroke, cy - 6 + stroke, cx + r_bot - stroke, cy + r_bot*2 - 6 - stroke), fill=(248, 250, 252, 255))

              return img

          icon = create_8ball_icon(1024)
          icon.save("assets/icon-only.png")
          icon.save("assets/icon-foreground.png")

          # Fondo para Adaptive Icon
          bg = Image.new("RGBA", (1024, 1024), (11, 7, 20, 255))
          bg.save("assets/icon-background.png")

          # Splash screen 2732x2732 con el icono centrado
          splash = Image.new("RGBA", (2732, 2732), (11, 7, 20, 255))
          icon_small = icon.resize((768, 768), Image.Resampling.LANCZOS)
          splash.paste(icon_small, ((2732 - 768) // 2, (2732 - 768) // 2), icon_small)
          splash.save("assets/splash.png")
          splash.save("assets/splash-dark.png")
          EOF

      - name: 5. Preparar proyecto Capacitor y empaquetar index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets

          npx cap init "Belmont Pool Club" "com.edwardbelmont.poolclub" --web-dir www
          npx cap add android
          npx cap copy android

          # Generar automáticamente todos los mipmaps, adaptive icons y splash screens en Android
          npx capacitor-assets generate --android

      - name: 6. Optimizar AndroidManifest (Horizontal, Red y Rendimiento)
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Habilitar tráfico de red para salas online y aceleración por hardware
          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:hardwareAccelerated="true"/g' "$MANIFEST"

          # Forzar modo horizontal (Landscape) para jugar billar cómodamente
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/g' "$MANIFEST"

          # Asegurar permiso de vibración si no existe
          if ! grep -q "android.permission.VIBRATE" "$MANIFEST"; then
            sed -i 's/<\/manifest>/<uses-permission android:name="android.permission.VIBRATE" \/>
<\/manifest>/g' "$MANIFEST"
          fi

      - name: 7. Compilar APK instalable (Debug firmado automáticamente)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Renombrar APK listo para instalar
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BelmontPoolClub.apk

      - name: 9. Subir APK como Descargable (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Belmont-Pool-Club-APK
          path: BelmontPoolClub.apk
          if-no-files-found: error
