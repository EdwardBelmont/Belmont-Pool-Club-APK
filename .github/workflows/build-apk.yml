                        <span id="modalP2Name" class="text-[10px] text-zinc-400 block">Alejandra</span>
                        <span id="modalP2Score" class="font-display font-bold text-lg text-white">0</span>
                    </div>
                </div>

                <button onclick="playRematch()" class="w-full py-2 rounded-xl bg-gradient-to-r from-purple-600 via-fuchsia-600 to-amber-500 text-white font-extrabold text-xs uppercase tracking-wider shadow-xl">
                    <i class="fa-solid fa-infinity mr-1"></i> Jugar Revancha (Saque 1 y 1)
                </button>
