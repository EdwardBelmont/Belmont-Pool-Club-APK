        <!-- MODAL D: VICTORY / REMATCH -->
        <div id="victoryModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-3">
            <div class="bg-zinc-950 border-2 border-amber-400/70 rounded-3xl max-w-xs w-full p-4 text-center shadow-[0_0_50px_rgba(251,191,36,0.25)]">
