                <button onclick="closeModal('customizerModal')" class="w-full mt-3 py-2 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 font-bold text-xs text-white uppercase tracking-wider">
                    Guardar y Volver
                </button>
            </div>
        </div>

        <!-- MODAL C: LOBBY / LOCAL & P2P ONLINE ROOMS -->
        <div id="lobbyModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-3">
            <div class="bg-zinc-950 border-2 border-purple-500/50 rounded-3xl max-w-md w-full p-4 shadow-2xl">
                <div class="flex items-center justify-between pb-2 border-b border-purple-900/50">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-crown text-amber-400"></i>
                        <h2 class="font-display font-bold text-sm text-white">Salón Belmont — Modos de Juego</h2>
                    </div>
                    <button onclick="closeModal('lobbyModal')" class="w-6 h-6 rounded-lg bg-zinc-900 text-zinc-400 hover:text-white">
