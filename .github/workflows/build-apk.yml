<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Belmont Pool Club — Edward vs Alejandra (8 Ball Pool)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for direct APK-to-APK Online Rooms with 4-letter codes -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ZERO SCROLL & FULLSCREEN LOCK FOR SAMSUNG A32 / S24 */
        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden !important;
            position: fixed;
            inset: 0;
            touch-action: none;
            background: radial-gradient(circle at 50% 45%, #190d2c 0%, #090511 70%, #040208 100%);
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        .font-display {
            font-family: 'Cinzel', serif;
        }

        /* Auto-Landscape Wrapper: Forces full-size landscape even if phone is held vertically */
        #appViewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            overscroll-behavior: none;
            transform-origin: center center;
        }

        /* Active Player Glow in Top HUD */
        .hud-player-active {
            border-color: #f59e0b !important;
            box-shadow: 0 0 14px rgba(245, 158, 11, 0.55), inset 0 0 10px rgba(245, 158, 11, 0.2);
        }

        /* 8 Ball Pool Left Power Tube */
        .power-tube-bg {
            background: linear-gradient(180deg, 
                rgba(34, 197, 94, 0.22) 0%, 
                rgba(234, 179, 8, 0.28) 50%, 
                rgba(239, 68, 68, 0.42) 100%);
            box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.9);
        }

        /* 8 Ball Pool Right Fine-Aim Gear Wheel */
        .gear-notches {
            background-image: repeating-linear-gradient(
                to bottom,
                rgba(216, 180, 254, 0.45) 0px,
                rgba(216, 180, 254, 0.45) 3px,
                transparent 3px,
                transparent 11px
            );
        }

        /* Floating Banner & Toast Animations */
        @keyframes bannerPop {
            0% { transform: translate(-50%, -14px) scale(0.85); opacity: 0; }
            15% { transform: translate(-50%, 0) scale(1.02); opacity: 1; }
            85% { transform: translate(-50%, 0) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -10px) scale(0.9); opacity: 0; }
        }
        .toast-banner {
            animation: bannerPop 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatReaction {
            0% { transform: translate(-50%, 20px) scale(0.6); opacity: 0; }
            18% { transform: translate(-50%, -10px) scale(1.08); opacity: 1; }
            82% { transform: translate(-50%, -38px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -60px) scale(0.85); opacity: 0; }
        }
        .floating-emote {
            animation: floatReaction 2.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Ball Return Track Roll-In Animation */
        @keyframes ballRollIn {
            0% { transform: translateX(90px) rotate(360deg) scale(0.75); opacity: 0; }
            70% { transform: translateX(-2px) rotate(-15deg) scale(1.04); opacity: 1; }
            100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
        }
        .ball-roll-anim {
            animation: ballRollIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .return-track-glass {
            background: linear-gradient(180deg, rgba(10, 6, 20, 0.94) 0%, rgba(28, 15, 48, 0.96) 50%, rgba(8, 5, 15, 0.98) 100%);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>
<body>
    <div id="appViewport">

        <!-- =========================================================================
             1. ULTRA-SLIM TOP ARCADE HUD BAR (MAXIMIZES TABLE SPACE ON SAMSUNG A32/S24)
             ========================================================================= -->
        <header class="w-full h-[42px] px-2 bg-black/85 border-b border-purple-800/50 backdrop-blur-md flex items-center justify-between gap-1.5 z-30 shrink-0">
            
            <!-- LEFT PLAYER CARD: EDWARD -->
            <div id="p1Card" class="flex items-center gap-1.5 bg-zinc-950/90 border border-purple-900/50 rounded-lg px-2 py-0.5 min-w-[130px] sm:min-w-[200px] transition-all duration-200">
                <div class="relative shrink-0">
                    <div class="w-6 h-6 rounded-md bg-gradient-to-br from-purple-600 to-indigo-950 flex items-center justify-center font-extrabold text-xs text-white border border-purple-300/40">
                        <span id="p1Avatar">E</span>
                    </div>
                    <span id="p1TurnDot" class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-amber-400 ring-1 ring-black animate-ping hidden"></span>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-1">
                        <span id="p1NameDisplay" class="font-extrabold text-[11px] text-white truncate leading-none">Edward</span>
                        <span id="p1GroupBadge" class="text-[8px] font-bold uppercase px-1 py-0.2 rounded bg-purple-950 text-purple-300 border border-purple-700/50 shrink-0 leading-tight">
                            ABIERTA
                        </span>
                    </div>
                    <div id="p1MiniSlots" class="flex items-center gap-0.5 mt-0.5"></div>
                </div>
            </div>

            <!-- CENTER CONTROLS: SPIN BALL, SCORE PILL & POP-UP MENU BUTTONS -->
            <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
                
                <!-- Mini Cue Ball Spin (Efecto) Trigger -->
                <button onclick="openModal('spinModal')" class="relative w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-gradient-to-br from-white via-zinc-200 to-zinc-400 border-2 border-amber-400 shadow flex items-center justify-center active:scale-95 transition" title="Efecto de Bola Blanca">
                    <div class="absolute w-full h-[1px] bg-zinc-400/60 pointer-events-none"></div>
                    <div class="absolute h-full w-[1px] bg-zinc-400/60 pointer-events-none"></div>
                    <div id="hudSpinDot" class="w-2 h-2 rounded-full bg-rose-600 border border-white pointer-events-none"></div>
                </button>

                <!-- Scoreboard & Room Code Pill -->
                <div onclick="openModal('lobbyModal')" class="cursor-pointer bg-zinc-950/95 hover:bg-zinc-900 border border-purple-700/50 rounded-lg px-2 py-0.5 text-center transition">
                    <div class="flex items-center justify-center gap-1 font-display font-black text-xs text-amber-300 leading-none">
                        <span id="p1Wins">0</span>
                        <span class="text-[9px] text-purple-400 font-sans">VS</span>
                        <span id="p2Wins">0</span>
                    </div>
                    <div id="hudModeLabel" class="text-[8px] font-semibold text-purple-300/80 uppercase tracking-tighter leading-none mt-0.5">
                        LOCAL ∞
                    </div>
                </div>

                <!-- Pop-up Menu Buttons -->
                <button onclick="openModal('lobbyModal')" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-br from-purple-600 to-fuchsia-700 text-white shadow flex items-center justify-center text-xs active:scale-95 transition" title="Salas Online / Modos">
                    <i class="fa-solid fa-wifi"></i>
                </button>

                <button onclick="toggleEmotePopover()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-zinc-900 border border-purple-700/40 text-amber-300 flex items-center justify-center text-xs active:scale-95 transition" title="Reacciones">
                    <i class="fa-solid fa-face-grin-wink"></i>
                </button>

                <button onclick="openModal('customizerModal')" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-zinc-900 border border-purple-700/40 text-purple-300 flex items-center justify-center text-xs active:scale-95 transition" title="Mesa y Taco">
                    <i class="fa-solid fa-palette"></i>
                </button>

                <button onclick="toggleAudio()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-zinc-900 border border-purple-700/40 text-purple-200 flex items-center justify-center text-xs active:scale-95 transition" title="Sonido">
                    <i id="soundIcon" class="fa-solid fa-volume-high text-purple-400"></i>
                </button>

                <button id="fullscreenBtn" onclick="toggleFullscreen()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-zinc-900 border border-purple-700/40 text-amber-300 flex items-center justify-center text-xs active:scale-95 transition" title="Pantalla Completa">
                    <i id="fullscreenIcon" class="fa-solid fa-expand"></i>
                </button>

                <button onclick="confirmResetMatch()" class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-zinc-900 border border-zinc-700 text-zinc-300 flex items-center justify-center text-xs active:scale-95 transition" title="Nueva Partida (Alternar Saque)">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>

            <!-- RIGHT PLAYER CARD: ALEJANDRA -->
            <div id="p2Card" class="flex items-center gap-1.5 flex-row-reverse bg-zinc-950/90 border border-purple-900/50 rounded-lg px-2 py-0.5 min-w-[130px] sm:min-w-[200px] transition-all duration-200">
                <div class="relative shrink-0">
                    <div class="w-6 h-6 rounded-md bg-gradient-to-br from-fuchsia-600 to-rose-950 flex items-center justify-center font-extrabold text-xs text-white border border-pink-300/40">
                        <span id="p2Avatar">A</span>
                    </div>
                    <span id="p2TurnDot" class="absolute -top-0.5 -left-0.5 w-2 h-2 rounded-full bg-amber-400 ring-1 ring-black animate-ping hidden"></span>
                </div>
                <div class="flex-1 min-w-0 text-right">
                    <div class="flex items-center justify-between flex-row-reverse gap-1">
                        <span id="p2NameDisplay" class="font-extrabold text-[11px] text-white truncate leading-none">Alejandra</span>
                        <span id="p2GroupBadge" class="text-[8px] font-bold uppercase px-1 py-0.2 rounded bg-purple-950 text-purple-300 border border-purple-700/50 shrink-0 leading-tight">
                            ABIERTA
                        </span>
                    </div>
                    <div id="p2MiniSlots" class="flex items-center justify-end gap-0.5 mt-0.5"></div>
                </div>
            </div>

        </header>

        <!-- =========================================================================
             2. MAIN ARENA (MAXIMIZED TABLE AREA FOR SAMSUNG A32 & S24)
             ========================================================================= -->
        <main class="flex-1 w-full min-h-0 flex items-center justify-between px-1 sm:px-2 py-0.5 gap-1 sm:gap-2 relative overflow-hidden">

            <!-- FLOATING NON-INTRUSIVE TURN / FOUL BANNER OVERLAY -->
            <div id="floatingStatusToast" class="pointer-events-none absolute top-1.5 left-1/2 -translate-x-1/2 z-30 px-3 py-0.5 rounded-full bg-black/80 border border-purple-500/50 shadow-xl backdrop-blur-md flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                <span id="statusBannerText" class="text-[10px] sm:text-xs font-bold text-purple-100 whitespace-nowrap">
                    Turno de Edward — Bola en mano detrás de la línea
                </span>
            </div>

            <!-- FLOATING EMOJI REACTIONS CONTAINER -->
            <div id="emojiOverlay" class="pointer-events-none absolute inset-0 z-40 overflow-hidden"></div>

            <!-- FLOATING QUICK EMOTE BAR POPOVER -->
            <div id="emotePopover" class="hidden absolute top-2 left-1/2 -translate-x-1/2 z-50 bg-zinc-950/95 border border-purple-500/60 rounded-2xl px-3 py-1.5 shadow-2xl backdrop-blur-md flex items-center gap-2">
                <button onclick="sendReaction('💜', '¡Con todo mi amor!')" class="hover:scale-125 active:scale-95 transition text-lg px-1">💜</button>
                <button onclick="sendReaction('🔥', '¡Qué buen tiro!')" class="hover:scale-125 active:scale-95 transition text-lg px-1">🔥</button>
                <button onclick="sendReaction('😎', 'Calculado al milímetro')" class="hover:scale-125 active:scale-95 transition text-lg px-1">😎</button>
                <button onclick="sendReaction('😂', '¡Qué suerte tuviste!')" class="hover:scale-125 active:scale-95 transition text-lg px-1">😂</button>
                <button onclick="sendReaction('😱', '¡Uff, casi entra!')" class="hover:scale-125 active:scale-95 transition text-lg px-1">😱</button>
                <button onclick="sendReaction('😘', 'Besito de la suerte')" class="hover:scale-125 active:scale-95 transition text-lg px-1">😘</button>
                <button onclick="sendReaction('🎱', '¡Voy por la Bola 8!')" class="hover:scale-125 active:scale-95 transition text-lg px-1">🎱</button>
            </div>

            <!-- LEFT CONTROL: 8 BALL POOL PULL-DOWN POWER TUBE ("TACO DE FUERZA") -->
            <div id="leftPowerPanel" class="h-[92%] w-10 sm:w-12 bg-zinc-950/90 border border-purple-800/50 rounded-xl p-1 flex flex-col items-center justify-between shrink-0 shadow-2xl z-20">
                <span class="text-[8px] font-extrabold uppercase tracking-tighter text-amber-300 text-center leading-tight">
                    TACO<br><span id="powerPctLabel" class="text-[9px] text-white font-mono">0%</span>
                </span>

                <!-- Interactive Pull-Down Tube -->
                <div id="powerTube" class="relative flex-1 w-full my-1 rounded-lg power-tube-bg border border-white/20 overflow-hidden cursor-ns-resize flex justify-center">
                    <div id="powerFillBox" class="absolute top-0 left-0 right-0 bg-gradient-to-b from-emerald-400/50 via-amber-500/70 to-rose-600/85 transition-none pointer-events-none" style="height: 0%;"></div>

                    <div id="tubeCueStick" class="w-2 h-full flex flex-col items-center pointer-events-none" style="transform: translateY(6px);">
                        <div class="w-2 h-1.5 bg-sky-400 rounded-t-sm"></div>
                        <div class="w-2 h-2 bg-white"></div>
                        <div class="w-1.5 h-24 bg-gradient-to-b from-amber-200 via-amber-600 to-purple-950"></div>
                        <div class="w-2 flex-1 bg-zinc-950 border-x border-purple-400/40"></div>
                    </div>

                    <div class="absolute inset-x-0 bottom-1.5 text-center pointer-events-none opacity-60">
                        <i class="fa-solid fa-angles-down text-white text-[10px] animate-bounce"></i>
                    </div>
                </div>

                <span class="text-[7px] font-bold uppercase text-purple-300/70 text-center leading-none">
                    Jala
                </span>
            </div>

            <!-- CENTER ARENA: AUTO-SCALED 2:1 POOL TABLE CONTAINER -->
            <div id="arenaCenter" class="flex-1 h-full min-w-0 min-h-0 flex items-center justify-center relative overflow-hidden">
                <div id="tableOuterFrame" class="relative flex items-center justify-center rounded-[16px] p-0.5 bg-gradient-to-b from-amber-900/50 via-stone-950 to-black shadow-[0_8px_30px_rgba(0,0,0,0.95)] border border-purple-500/35">
                    <canvas id="poolCanvas" class="block rounded-[13px] cursor-crosshair"></canvas>
                </div>
            </div>

            <!-- RIGHT CONTROL: 8 BALL POOL PRECISION AIM WHEEL ("RUEDA FINA") -->
            <div class="h-[92%] w-10 sm:w-12 bg-zinc-950/90 border border-purple-800/50 rounded-xl p-1 flex flex-col items-center justify-between shrink-0 shadow-2xl z-20">
                <span class="text-[8px] font-extrabold uppercase tracking-tighter text-purple-300 text-center leading-tight">
                    MIRA<br>FINA
                </span>

                <div id="fineAimWheel" class="relative flex-1 w-full my-1 rounded-lg bg-zinc-900/95 border border-purple-500/40 overflow-hidden cursor-ns-resize flex items-center justify-center shadow-inner">
                    <div id="gearNotchTrack" class="w-full h-[200%] gear-notches pointer-events-none" style="transform: translateY(0px);"></div>
                    <div class="absolute inset-x-0 h-4 border-y border-amber-400/60 bg-amber-400/10 pointer-events-none"></div>
                </div>

                <div class="flex w-full gap-0.5">
                    <button onclick="nudgeAim(-0.004)" class="flex-1 py-0.5 rounded bg-purple-950 hover:bg-purple-800 text-[9px] text-purple-200 border border-purple-700/50 active:scale-90">
                        <i class="fa-solid fa-minus"></i>
                    </button>
                    <button onclick="nudgeAim(0.004)" class="flex-1 py-0.5 rounded bg-purple-950 hover:bg-purple-800 text-[9px] text-purple-200 border border-purple-700/50 active:scale-90">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            </div>

        </main>

        <!-- =========================================================================
             3. COMPACT BOTTOM BALL RETURN TRACK (RIEL DE BOLAS ENTRONERADAS)
             ========================================================================= -->
        <footer class="w-full h-[28px] px-2 bg-black/90 border-t border-purple-800/50 flex items-center justify-between gap-2 z-30 shrink-0">
            <div class="flex items-center gap-1 shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-purple-400 animate-pulse"></span>
                <span id="breakerBadgeText" class="text-[9px] font-extrabold uppercase tracking-wider text-purple-200">
                    Saque (1 y 1): Edward
                </span>
            </div>

            <div class="flex-1 max-w-xl h-[22px] rounded-full return-track-glass border border-purple-500/40 px-2 flex items-center gap-1 overflow-hidden">
                <div class="flex items-center gap-1 text-[8px] font-black uppercase tracking-wider text-amber-400/90 shrink-0 pr-1 border-r border-purple-800/60">
                    <i class="fa-solid fa-box-archive text-[9px]"></i>
                    <span>Tronera</span>
                </div>
                <div id="ballReturnTrack" class="flex-1 flex items-center gap-1 overflow-hidden">
                    <span class="text-[9px] text-purple-300/40 italic font-medium select-none">Sin bolas embocadas...</span>
                </div>
                <span id="pottedCountLabel" class="text-[9px] font-mono font-extrabold text-purple-300 shrink-0 pl-1">0/15</span>
            </div>

            <button onclick="openModal('spinModal')" class="hidden sm:flex items-center gap-1 px-2 py-0.5 rounded-full bg-zinc-900 border border-purple-700/40 text-[9px] font-bold text-purple-200 shrink-0">
                <i class="fa-solid fa-compass-drafting text-rose-400"></i>
                <span id="spinTypeLabel">Efecto: Centro</span>
            </button>
        </footer>

        <!-- =========================================================================
             4. POP-UP OVERLAY MODALS ("MENÚS APARECIBLES")
             ========================================================================= -->

        <!-- MODAL A: CUE BALL SPIN / EFECTO -->
        <div id="spinModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-3">
            <div class="bg-zinc-950 border-2 border-purple-500/50 rounded-3xl max-w-xs w-full p-4 text-center shadow-2xl">
                <div class="flex items-center justify-between pb-2 border-b border-purple-900/50">
                    <h3 class="font-display font-bold text-xs text-white uppercase tracking-wider">Efecto de Bola Blanca</h3>
                    <button onclick="closeModal('spinModal')" class="w-6 h-6 rounded-lg bg-zinc-900 text-zinc-400 hover:text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="my-3 flex items-center justify-center">
                    <div id="modalSpinBall" class="relative w-32 h-32 rounded-full bg-gradient-to-br from-white via-zinc-100 to-zinc-400 shadow-[inset_-10px_-10px_25px_rgba(0,0,0,0.45),0_0_25px_rgba(168,85,247,0.35)] border-4 border-purple-400 cursor-pointer flex items-center justify-center">
                        <div class="absolute w-4/5 h-4/5 rounded-full border border-dashed border-zinc-400/70 pointer-events-none"></div>
                        <div class="absolute w-full h-[1px] bg-zinc-400/60 pointer-events-none"></div>
                        <div class="absolute h-full w-[1px] bg-zinc-400/60 pointer-events-none"></div>
                        <div id="modalSpinDot" class="w-5 h-5 rounded-full bg-rose-600 border-2 border-white shadow-md pointer-events-none"></div>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="resetSpin()" class="flex-1 py-1.5 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 text-xs font-bold text-zinc-300">
                        Centrar
                    </button>
                    <button onclick="closeModal('spinModal')" class="flex-1 py-1.5 rounded-xl bg-gradient-to-r from-purple-600 to-fuchsia-600 text-xs font-bold text-white shadow-lg">
                        Listo
                    </button>
                </div>
            </div>
        </div>

        <!-- MODAL B: TABLE & CUE STICK CUSTOMIZER -->
        <div id="customizerModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden items-center justify-center p-3">
            <div class="bg-zinc-950 border-2 border-purple-500/50 rounded-3xl max-w-md w-full p-4 shadow-2xl">
                <div class="flex items-center justify-between pb-2 border-b border-purple-900/50">
                    <h3 class="font-display font-bold text-sm text-white flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-purple-400"></i> Personalizar Club Belmont
                    </h3>
                    <button onclick="closeModal('customizerModal')" class="w-6 h-6 rounded-lg bg-zinc-900 text-zinc-400 hover:text-white">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <div class="mt-2.5">
                    <label class="text-[11px] font-bold uppercase tracking-wider text-purple-300 block mb-1.5">Color del Paño</label>
                    <div class="grid grid-cols-5 gap-1.5">
                        <button onclick="setFeltTheme('amethyst')" class="p-1.5 rounded-xl bg-purple-950 border border-purple-400/50 flex flex-col items-center gap-1">
                            <span class="w-5 h-5 rounded-full bg-purple-800 border border-white/60"></span>
                            <span class="text-[9px] font-semibold text-purple-200">Belmont</span>
                        </button>
                        <button onclick="setFeltTheme('tournament')" class="p-1.5 rounded-xl bg-sky-950 border border-sky-400/50 flex flex-col items-center gap-1">
                            <span class="w-5 h-5 rounded-full bg-blue-700 border border-white/60"></span>
                            <span class="text-[9px] font-semibold text-sky-200">Torneo 8</span>
                        </button>
                        <button onclick="setFeltTheme('emerald')" class="p-1.5 rounded-xl bg-emerald-950 border border-emerald-400/50 flex flex-col items-center gap-1">
                            <span class="w-5 h-5 rounded-full bg-emerald-700 border border-white/60"></span>
                            <span class="text-[9px] font-semibold text-emerald-200">Clásico</span>
                        </button>
                        <button onclick="setFeltTheme('crimson')" class="p-1.5 rounded-xl bg-rose-950 border border-rose-400/50 flex flex-col items-center gap-1">
                            <span class="w-5 h-5 rounded-full bg-rose-900 border border-white/60"></span>
                            <span class="text-[9px] font-semibold text-rose-200">Casino</span>
                        </button>
